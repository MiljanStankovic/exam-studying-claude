<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studying</title>
<style>
  /* Direction
     Product   a study companion that keeps everything for one subject in one place and does the filing
     Character patient, exact, quietly encouraging
     World     a student's desk: a binder with a divider per exam part, index cards, a ruled margin
     Moments   the points track toward passing, and the index card itself
     Signature the red margin line of an index card (cards, questions, the sorting sheet) */
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-secondary, #f7f7f6);
    --side: var(--color-background-tertiary, #f0efed);
    --card: var(--color-background-primary, #ffffff);
    --raised: #f1f1f0;
    --t1: var(--color-text-primary, #191919);
    --t2: var(--color-text-secondary, #545454);
    --t3: var(--color-text-tertiary, #767676);
    --line: rgba(25, 25, 25, .08);
    --line2: rgba(25, 25, 25, .16);
    --accent: #2f5597;
    --on-accent: #ffffff;
    --accent-soft: rgba(47, 85, 151, .10);
    --ok: #237a4b; --bad: #c0362c; --warn: #8a6212;
    --paper: #fffef9;
    --margin: #c8463b;
    --font: var(--font-sans, "Inter", system-ui, -apple-system, "Segoe UI", sans-serif);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
    --ease: cubic-bezier(.22, 1, .36, 1);
    --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 8px 24px rgba(0, 0, 0, .06);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: var(--color-background-secondary, #141415); --side: var(--color-background-tertiary, #0f0f10); --card: var(--color-background-primary, #19191b);
    --raised: #232325; --t1: var(--color-text-primary, #ededed); --t2: var(--color-text-secondary, #a1a1a6); --t3: var(--color-text-tertiary, #85858b);
    --line: rgba(237, 237, 237, .08); --line2: rgba(237, 237, 237, .16);
    --accent: #9fb9e6; --on-accent: #0e1420; --accent-soft: rgba(159, 185, 230, .12);
    --ok: #4cc38a; --bad: #e5484d; --warn: #d9b45a; --paper: #1e1e20; --margin: #d9675c; --shadow: none; } }
  :root[data-theme="dark"] {
    --raised: #232325; --line: rgba(237, 237, 237, .08); --line2: rgba(237, 237, 237, .16);
    --accent: #9fb9e6; --on-accent: #0e1420; --accent-soft: rgba(159, 185, 230, .12);
    --ok: #4cc38a; --bad: #e5484d; --warn: #d9b45a; --paper: #1e1e20; --margin: #d9675c; --shadow: none; }

  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--t1); font: 14px/20px var(--font); background: transparent; }
  body.full { background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  /* shell */
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 600px; height: var(--h, auto);
    padding-top: var(--top, 0px); padding-bottom: var(--bottom, 0px); background: var(--bg); border-radius: 12px; overflow: hidden; }
  body.full .shell { height: 100vh; border-radius: 0; }
  aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 12px 8px; gap: 4px; min-height: 0; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; font-weight: 500; font-size: 15px; }
  .mark { width: 16px; height: 20px; border: 1.5px solid var(--t2); border-radius: 3px; position: relative; flex: none; }
  .mark::before { content: ""; position: absolute; left: 3px; top: -1.5px; bottom: -1.5px; width: 1.5px; background: var(--margin); }
  .navlabel { padding: 0 8px; margin: 20px 0 4px; color: var(--t3); font-size: 12px; line-height: 16px; display: flex; justify-content: space-between; align-items: center; }
  .navlabel button { color: var(--t3); border-radius: 4px; padding: 0 4px; }
  .navlabel button:hover { color: var(--t1); }
  .nav { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 8px; border-radius: 8px; color: var(--t2); width: 100%; text-align: left;
    transition: background-color .15s var(--ease), color .15s var(--ease); }
  .nav:hover { background: var(--raised); color: var(--t1); }
  .nav[aria-current] { background: var(--card); color: var(--t1); box-shadow: inset 0 0 0 1px var(--line); }
  .nav .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav .count { font: 12px/16px var(--mono); color: var(--t3); font-variant-numeric: tabular-nums; }
  .nav .count.hot { color: var(--accent); }
  .side-foot { margin-top: auto; padding-top: 12px; display: grid; gap: 2px; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 32px; flex: none; }
  .top .crumb { color: var(--t3); display: flex; gap: 6px; align-items: center; min-width: 0; }
  .top .crumb button { color: var(--t2); }
  .top .crumb button:hover { color: var(--t1); }
  .top .spacer { flex: 1; }
  .mobile-only { display: none; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 32px 48px; }
  .page { max-width: 1040px; display: grid; gap: 32px; animation: rise .4s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  /* progress */
  .progress { margin: 0 32px 8px; padding: 12px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 8px; flex: none; }
  .progress .row1 { display: flex; justify-content: space-between; gap: 12px; }
  .progress .job { font-weight: 500; }
  .progress .eta { color: var(--t3); font: 12px/20px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .track b { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s var(--ease); }
  .steps { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--t3); font-size: 12px; line-height: 16px; }
  .steps .now { color: var(--t1); } .steps .done { color: var(--t2); }

  /* type */
  h1 { font: 400 32px/1.15 var(--serif); margin: 0; letter-spacing: -.005em; text-wrap: balance; }
  h2 { font: 500 15px/20px var(--font); margin: 0; }
  h3 { font: 500 14px/20px var(--font); margin: 0; }
  p { margin: 0; }
  .sub { color: var(--t2); max-width: 64ch; }
  .muted { color: var(--t3); }
  .meta { color: var(--t3); font: 12px/16px var(--mono); font-variant-numeric: tabular-nums; }
  .head { display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .stack { display: grid; gap: 12px; }
  .section { display: grid; gap: 12px; }
  .section > .row.between { min-height: 32px; }

  /* surfaces and controls */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; align-content: start; min-width: 0; box-shadow: var(--shadow); }
  .panel.tight { padding: 4px; gap: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; font-weight: 500;
    background: var(--card); border: 1px solid var(--line2); color: var(--t1); white-space: nowrap;
    transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease); }
  .btn:hover { background: var(--raised); }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn.quiet { background: none; border-color: transparent; color: var(--t2); padding: 0 10px; }
  .btn.quiet:hover { background: var(--raised); color: var(--t1); }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--t2); }
  .icon-btn:hover:not(:disabled) { background: var(--raised); color: var(--t1); }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .icon-btn.mobile-only { display: none; }
  input[type=text], input[type=number], input[type=date], select, textarea { background: var(--card); border: 1px solid var(--line2); border-radius: 8px; padding: 0 10px; height: 36px; min-width: 0; }
  textarea { width: 100%; min-height: 96px; padding: 8px 10px; resize: vertical; line-height: 20px; height: auto; }
  label.field { display: grid; gap: 6px; color: var(--t2); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--card); user-select: none; cursor: pointer;
    transition: border-color .15s var(--ease), background-color .15s var(--ease); }
  .chip input { margin: 0; accent-color: var(--accent); }
  .chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .tag { font: 12px/16px var(--mono); color: var(--t3); }
  .notice { border-radius: 8px; padding: 10px 12px; background: var(--raised); color: var(--t2); }

  /* subject list */
  .subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .subject { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 12px; box-shadow: var(--shadow);
    transition: border-color .15s var(--ease); }
  .subject:hover { border-color: var(--line2); }
  .subject .name { font: 400 20px/1.25 var(--serif); }

  /* the moment: points toward passing */
  .points { display: grid; gap: 16px; }
  .points .big { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
  .points .big b { font: 400 40px/1 var(--serif); }
  .bar { position: relative; height: 40px; display: flex; gap: 4px; padding-top: 0; }
  .seg { position: relative; height: 24px; border-radius: 6px; background: var(--raised); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
  .seg b { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 6px 0 0 6px; }
  .seg span { position: absolute; left: 8px; top: 4px; font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; right: 8px; }
  .seg.lit span { color: var(--on-accent); }
  .passline { position: absolute; top: -4px; height: 32px; width: 2px; background: var(--margin); border-radius: 1px; }
  .passline i { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); font: 12px/16px var(--mono); font-style: normal; color: var(--margin); white-space: nowrap; }
  .legend { display: grid; gap: 0; }
  .legend .lrow { display: grid; grid-template-columns: minmax(0, 1fr) 96px 96px; gap: 12px; align-items: center; height: 36px; border-top: 1px solid var(--line); }
  .legend .lrow:first-child { border-top: 0; }
  .legend .num { text-align: right; font: 13px/20px var(--mono); font-variant-numeric: tabular-nums; color: var(--t2); }

  .next { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
  .next p { font: 400 18px/1.4 var(--serif); }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }

  /* status dots and the per-part dashboard */
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line2); flex: none; }
  .dot.done { background: var(--ok); } .dot.studying { background: var(--accent); } .dot.ready { background: var(--ok); opacity: .55; }
  .dot.good { background: var(--ok); } .dot.learning { background: var(--accent); } .dot.weak { background: var(--bad); }
  .nav .dot { margin: 0 4px; }
  .plan .lrow { grid-template-columns: minmax(0, 1fr) 120px 104px 88px; }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--t2); font-size: 13px; }
  .seg i { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); border-radius: 6px 0 0 6px; }
  .seg b { z-index: 1; }
  .seg span { z-index: 2; }
  .topics { display: grid; }
  .topic { display: grid; grid-template-columns: 12px minmax(0, 1fr) 160px 64px auto; gap: 12px; align-items: center; min-height: 48px; padding: 8px 12px; }
  .topic + .topic { border-top: 1px solid var(--line); }
  .topic .nm { display: grid; gap: 2px; min-width: 0; }
  .topic .nm small { color: var(--t3); font-size: 12px; line-height: 16px; }
  .mastery { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
  .mastery b { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .mastery.weak b { background: var(--bad); } .mastery.good b { background: var(--ok); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; display: grid; gap: 8px; box-shadow: var(--shadow); }
  .stat b { font: 400 28px/1 var(--serif); font-variant-numeric: tabular-nums; }
  .stat span { color: var(--t3); font-size: 13px; }

  /* lists of files and items */
  .list { display: grid; }
  .item { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 44px; padding: 8px 12px; border-radius: 10px; }
  .item.sel { grid-template-columns: 20px 20px minmax(0, 1fr) auto; }
  .item + .item { box-shadow: 0 -1px 0 var(--line); }
  .item:hover { background: var(--raised); box-shadow: none; }
  .item:hover + .item { box-shadow: none; }
  .item .name { min-width: 0; display: grid; gap: 2px; text-align: left; }
  .item .name b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .name small { color: var(--t3); font-size: 12px; line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .side { display: flex; align-items: center; gap: 12px; color: var(--t3); }
  .item input[type=checkbox] { margin: 0; accent-color: var(--accent); }
  .item .ic { color: var(--t3); display: grid; place-items: center; }
  .group-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px; }
  .empty { padding: 24px 12px; color: var(--t3); display: grid; gap: 12px; justify-items: start; }
  .selbar { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px;
    background: var(--card); border: 1px solid var(--line2); border-radius: 12px; box-shadow: var(--shadow); }

  /* inbox: the drop zone */
  .inbox { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 20px; border-radius: 14px;
    border: 1.5px dashed var(--line2); background: var(--card); }
  .inbox.full { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
  .inbox .count { font: 400 32px/1 var(--serif); font-variant-numeric: tabular-nums; }

  /* index card: the signature */
  .card { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 24px 24px 24px 52px; box-shadow: var(--shadow); }
  .card::before { content: ""; position: absolute; left: 32px; top: 0; bottom: 0; width: 1.5px; background: var(--margin); opacity: .7; }
  .card .q { font: 400 21px/1.45 var(--serif); }
  .card .a { font: 400 16px/1.6 var(--serif); }
  .card .src { font: 12px/16px var(--mono); color: var(--t3); }
  .flash { min-height: 300px; display: grid; align-content: center; gap: 16px; cursor: pointer; }
  .flash.back { align-content: start; }
  .rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .rate .btn { height: 52px; flex-direction: column; gap: 2px; }
  .rate small { color: var(--t3); font: 12px/16px var(--mono); }

  /* sorting sheet */
  .sheet { display: grid; }
  .sheet .srow { display: grid; grid-template-columns: 20px minmax(0, 1fr) 96px 180px; gap: 12px; align-items: center; padding: 12px 12px 12px 16px; }
  .sheet .srow + .srow { border-top: 1px solid var(--line); }
  .sheet .srow.skip { opacity: .55; }
  .sheet .srow input[type=text] { width: 100%; height: 32px; }
  .sheet .srow select { height: 32px; width: 100%; }
  .sheet .why { grid-column: 2 / -1; color: var(--t3); font-size: 13px; margin-top: -4px; }
  .sheet .srow input[type=checkbox] { accent-color: var(--accent); margin: 0; }

  /* markdown */
  .md { display: grid; gap: 8px; }
  .md h2, .md h3 { font-family: var(--serif); font-weight: 400; }
  .md h2 { font-size: 20px; line-height: 28px; margin-top: 8px; } .md h3 { font-size: 17px; line-height: 24px; margin-top: 4px; }
  .md ul, .md ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  .md pre { margin: 0; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font: 13px/20px var(--mono); }
  .md code { font: 13px/20px var(--mono); background: var(--raised); padding: 1px 4px; border-radius: 4px; }
  .md pre code { background: none; padding: 0; }

  /* test */
  .qhead { display: flex; justify-content: space-between; gap: 12px; color: var(--t3); font: 12px/16px var(--mono); font-variant-numeric: tabular-nums; }
  .opts { display: grid; gap: 8px; }
  .opt { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--card); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; font: 16px/1.45 var(--serif); cursor: pointer; }
  .opt input { margin: 4px 0 0; accent-color: var(--accent); }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .blank { width: 9em; border: 0 !important; border-bottom: 1.5px solid var(--line2) !important; border-radius: 0 !important; background: transparent !important; padding: 0 2px !important; height: auto !important; font: inherit; }
  .match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; font: 16px/1.4 var(--serif); }
  .order { display: grid; gap: 6px; }
  .order div { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px; align-items: center; background: var(--card); border: 1px solid var(--line2); border-radius: 10px; padding: 4px 4px 4px 12px; font: 16px/1.4 var(--serif); }
  .timer { font: 500 14px/20px var(--mono); font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--bad); }
  .qnav { display: flex; flex-wrap: wrap; gap: 4px; }
  .qnav button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font: 12px/1 var(--mono); color: var(--t2); }
  .qnav button.ans { background: var(--raised); border-color: var(--line2); color: var(--t1); }
  .qnav button[aria-current] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--t1); }
  .score { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
  .score b { font: 400 48px/1 var(--serif); }
  .pts { font: 13px/20px var(--mono); font-variant-numeric: tabular-nums; color: var(--t2); }
  .pts.full { color: var(--ok); } .pts.zero { color: var(--bad); }

  /* mind map */
  .tree { list-style: none; margin: 0; padding-left: 20px; border-left: 1px solid var(--line2); display: grid; gap: 2px; }
  .tree.root { border-left: 0; padding-left: 0; }
  .tree summary { cursor: pointer; padding: 4px 0; font: 16px/1.45 var(--serif); list-style: none; }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary::before { content: "+"; display: inline-block; width: 16px; color: var(--t3); font-family: var(--mono); }
  .tree details[open] > summary::before { content: "−"; }
  .tree .leaf { padding: 4px 0 4px 16px; font: 15px/1.45 var(--serif); color: var(--t2); }

  .toast { position: fixed; left: 50%; bottom: calc(16px + var(--bottom, 0px)); transform: translateX(-50%); background: var(--t1); color: var(--card); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 10; max-width: calc(100% - 32px); }
  .skeleton { display: grid; gap: 12px; }
  .skeleton i { display: block; height: 16px; border-radius: 4px; background: var(--raised); }

  /* mobile: the sidebar becomes a top bar with section tabs */
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    aside { display: none; }
    .mobile-only { display: flex; }
    .icon-btn.mobile-only { display: grid; }
    .top { padding: 0 16px; height: 52px; gap: 8px; }
    .top .crumb { flex: 1; overflow: hidden; white-space: nowrap; }
    .top .crumb > :not(.keep) { display: none; }
    .top .spacer { display: none; }

// progress bar + estimate from the pace of the steps so far

  const parts = (ix?.parts ?? []).map((p) => `<button class="nav" data-act="open-part" data-p="${esc(p.name)}" ${S.view === 'part' && S.part === p.name ? 'aria-current="page"' : ''}>${dot(p.status)}<span class="lbl">${esc(p.name)}</span><span class="count">${p.status === 'done' && p.score != null ? `${num(p.score)}/${num(p.points)}` : p.date ? esc(fmtDate(p.date)) : ''}</span></button>`).join('');
  const inbox = ix?.inbox.length ?? 0;
  const due = ix ? groups(ix).flatMap((g) => g.generated).reduce((a, x) => a + num(x.due), 0) : 0;
  return SECTIONS.map(([v, l, ic]) => navBtn(v, l, ic,
    v === 'materials' && inbox ? `<span class="count hot">${inbox} new</span>` : v === 'study' && due ? `<span class="count hot">${due} due</span>` : '') + (v === 'overview' ? parts : '')).join('');
}

    ${!subj.length ? `<button class="nav" data-act="goto" data-v="subjects">${icon('book')}<span class="lbl">All subjects</span></button>` : ''}
    ${inSubject ? `<div class="navlabel"><span>${esc(S.subject)}</span></div>${sectionNav()}` : ''}
    <div class="side-foot">

function drawTop() {
  const inSubject = S.subject && SUBJECT_VIEWS.includes(S.view);
  const title = { setup: 'Setup', subjects: 'Subjects' }[S.view];

         ${sub ? `<span aria-hidden="true">/</span>${parent && parent !== 'overview' ? `<button data-act="goto" data-v="${parent}">${esc(SECTIONS.find((s) => s[0] === parent)?.[1] ?? '')}</button><span aria-hidden="true">/</span>` : ''}<span>${sub}</span>` : ''}`
      : `<span class="keep">${esc(title ?? '')}</span>`}</div>
    <span class="spacer"></span>
    ${inSubject ? `<button class="btn sm" data-act="refresh" title="Read the subject again from your storage">${icon('refresh')}<span class="hide-sm">Refresh</span></button>

}

// ---------- setup ----------
const STORAGES = [
  ['Google Drive', 'Files appear in a Studying folder you can also open in Drive'],
  ['MEGA', 'Your MEGA cloud drive, end-to-end encrypted'],
  ['Other', 'Another storage that has a Claude connector'],
];
function viewSetup() {
  const st = S.setup, names = ['Welcome', 'Storage', 'Connect', 'Workspace', 'First subject'];
  const head = `<p class="meta">Step ${Math.min(st.step, 4) + 1} of 5 · ${names[Math.min(st.step, 4)]}</p>`;
  if (st.step === 0) return `<div class="head">${head}<h1>One place for every subject you study</h1>
    <p class="sub">Drop your course documents into a subject. Claude sorts them, turns them into summaries, flashcards and practice exams, grades your answers and remembers what you still need. Everything stays in your own cloud storage.</p></div>
    <div class="row"><button class="btn primary" data-act="setup-next">Get started</button></div>`;
  if (st.step === 1) return `<div class="head">${head}<h1>Where should your things live</h1>
    <p class="sub">Studying keeps nothing on its own server</p></div>
    <div class="list panel tight">${STORAGES.map(([n, d]) => `<label class="item" style="cursor:pointer"><input type="radio" name="storage" data-act="pick-storage" data-s="${esc(n)}" ${st.storage === n ? 'checked' : ''}>
      <span class="name"><b>${esc(n)}</b><small>${esc(d)}</small></span><span></span></label>`).join('')}</div>
    <div class="row"><button class="btn quiet" data-act="setup-back">Back</button><button class="btn primary" data-act="setup-next" ${st.storage ? '' : 'disabled'}>Continue</button></div>`;
  if (st.step === 2) {
    const s = st.status;
    return `<div class="head">${head}<h1>Connect ${esc(st.storage)}</h1></div>
    <ol class="sub stack" style="padding-left:20px;margin:0">
      <li>Open Claude's connectors and connect <strong>${esc(st.storage)}</strong>. You sign in there; Studying never sees your password</li>
      <li>Come back and check the connection. Claude creates a <strong>Studying</strong> folder for you</li>
    </ol>
    ${s && !s.ok ? `<p class="notice">Claude could not reach ${esc(st.storage)} yet. Connect it, then check again</p>` : ''}
    <div class="row"><button class="btn quiet" data-act="setup-back">Back</button><button class="btn" data-act="open-connectors">${icon('ext')}Open connectors</button>
    <button class="btn primary" data-act="check-storage">Check connection</button></div>`;
  }
  if (st.step === 3) return `<div class="head">${head}<h1>Your workspace is ready</h1>
    <p class="sub">Claude created the Studying folder in ${esc(st.storage)}, with a place for your rules and one folder per subject</p></div>
    <div class="row"><button class="btn primary" data-act="setup-next">Add your first subject</button></div>`;
  return `<div class="head">${head}<h1>Add a subject</h1></div>${subjectForm()}`;
}
function subjectForm() {
  return `<form class="panel" id="subject-form">
    <div class="grid2">
      <label class="field">Subject<input type="text" id="f-name" required placeholder="Software Design"></label>
      <label class="field">Exam date<input type="date" id="f-date"></label>
    </div>
    <label class="field">Exam parts, comma separated<input type="text" id="f-parts" placeholder="Oral 1, Oral 2, Project"></label>
    <label class="field">How is it graded<textarea id="f-notes" placeholder="Two tests of 15 and 10 points and a project of 7; 15 points in total to pass"></textarea></label>

// ---------- subjects ----------

  return `<div class="row between"><h1>Your subjects</h1><button class="btn" data-act="new-subject">${icon('plus')}Add subject</button></div>
    ${S.subjects.length ? `<div class="subjects">${S.subjects.map((s) => {
      const d = daysTo(s.examDate);
      return `<button class="subject" data-act="pick-subject" data-s="${esc(s.name)}"><span class="name">${esc(s.name)}</span>
        <span class="muted">${esc(arr(s.parts).join(' · '))}</span>
        <span class="meta">${d === null ? 'Exam date not set' : d >= 0 ? `${d} days to exam` : 'Exam passed'}${num(s.due) ? ` · ${num(s.due)} cards due` : ''}</span></button>`;
    }).join('')}</div>` : `<div class="empty"><p>No subjects yet</p></div>`}

function viewLoading() {
  return `<div class="head"><h1>${esc(S.subject || 'Subject')}</h1><p class="sub">${S.loading ? 'Claude is reading this subject from your storage' : 'Not loaded yet'}</p></div>
    <div class="panel skeleton"><i style="width:40%"></i><i style="width:90%"></i><i style="width:70%"></i></div>
    ${S.loading ? '' : `<div class="row"><button class="btn primary" data-act="refresh">Load ${esc(S.subject)}</button></div>`}`;
}

// ---------- overview ----------
function pointsTrack(ix) {
  const parts = ix.parts.filter((p) => num(p.points) > 0);
  const total = num(ix.totalPoints) || parts.reduce((a, p) => a + num(p.points), 0);
  if (!total) return '';
  const pass = num(ix.passPoints);
  const earned = parts.reduce((a, p) => a + (p.status === 'done' && p.score != null ? Math.min(num(p.score), num(p.points)) : 0), 0);
  const practice = parts.reduce((a, p) => a + (p.status !== 'done' && p.best != null ? Math.min(num(p.best), num(p.points)) : 0), 0);
  const need = Math.max(0, pass - earned);
  const line = !pass ? '' : earned >= pass ? 'You have passed' : `${need} more to pass${practice ? `, practice scores suggest ${practice} more` : ''}`;
  return `<section class="panel points">
    <div class="row between"><h2>Points</h2><span class="meta">${pass ? `${pass} of ${total} to pass` : `${total} points`}</span></div>
    <div class="big"><b>${earned}</b><span class="muted">of ${total} earned${line ? ` · ${line}` : ''}</span></div>
    <div class="bar">
      ${parts.map((p) => { const w = (num(p.points) / total) * 100, done = p.status === 'done' && p.score != null;
        const f = done ? Math.min(1, num(p.score) / num(p.points)) * 100 : 0, pr = !done && p.best != null ? Math.min(1, num(p.best) / num(p.points)) * 100 : 0;
        return `<div class="seg ${f >= 55 ? 'lit' : ''}" style="width:calc(${w}% - 3px)" title="${esc(p.name)}">${pr ? `<i style="width:${pr}%"></i>` : ''}${f ? `<b style="width:${f}%"></b>` : ''}<span>${esc(p.name)}</span></div>`; }).join('')}
      ${pass ? `<div class="passline" style="left:calc(${(pass / total) * 100}% - 1px)"><i>${pass} to pass</i></div>` : ''}
    </div>
    <p class="muted">Solid is earned on the real exam, outlined is your best practice score</p>
  </section>`;
}
function examPlan(ix) {
  return `<section class="panel"><div class="row between"><h2>Exam parts</h2><span class="meta">click a part for its dashboard</span></div>
    <div class="legend plan">${ix.parts.map((p) => `<button class="lrow" data-act="open-part" data-p="${esc(p.name)}" style="text-align:left;width:100%">
      <span class="status" style="color:var(--t1)">${dot(p.status)}${esc(p.name)}</span>
      <span class="num">${p.date ? esc(new Date(p.date).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })) : 'date not set'}</span>
      <span class="num">${esc(p.status)}</span>
      <span class="num">${p.status === 'done' && p.score != null ? `${num(p.score)} / ${num(p.points)}` : p.best != null ? `best ${num(p.best)}` : `— / ${num(p.points)}`}</span></button>`).join('')}</div></section>`;
}
const NEXT_ACT = { sort: ['Sort the inbox', 'sort'], make: ['Make study material', 'make'], review: ['Review due cards', 'due-cards'], test: ['Take a practice test', 'mock-exam'], read: ['Open notes', 'next-step'] };
function viewOverview() {
  const ix = cur(), d = daysTo(ix.examDate);
  const counts = groups(ix).map((g) => ({ title: g.title, m: g.materials.length, g: g.generated.length }));
  const recent = groups(ix).flatMap((g) => g.generated.map((x) => ({ ...x, part: g.title }))).slice(-5).reverse();
  const nx = ix.nextStep?.text ? ix.nextStep : ix.inbox.length ? { text: `${plural(ix.inbox.length, 'document is', 'documents are')} waiting in the inbox. Let Claude read and sort them`, action: 'sort' }
    : counts.every((c) => !c.m) ? { text: 'Drop your course documents into the inbox. Claude reads them and files each one where it belongs', action: 'add' } : null;
  const [label, act] = nx?.action === 'add' ? ['Open the inbox', 'open-inbox'] : NEXT_ACT[nx?.action] ?? ['Ask Claude what to do next', 'next-step'];
  return `<div class="head"><h1>${esc(ix.name)}</h1>
      <p class="meta">${d === null ? 'Exam date not set' : d >= 0 ? `${d} days to exam` : 'Exam passed'} · ${plural(ix.parts.length, 'part', 'parts')}${ix.totalPoints ? ` · ${num(ix.totalPoints)} points` : ''}</p></div>
    ${nx ? `<section class="panel next"><div class="stack" style="gap:6px"><span class="meta">Next step</span><p>${esc(nx.text)}</p></div>
      <button class="btn primary" data-act="${act}">${label}</button></section>` : ''}
    ${pointsTrack(ix)}
    ${examPlan(ix)}
    <div class="cols">
      <section class="panel"><div class="row between"><h2>Materials</h2><button class="btn sm quiet" data-act="goto" data-v="materials">Open</button></div>
        <div class="legend">
          <div class="lrow"><span>Inbox</span><span class="num">${ix.inbox.length ? `${ix.inbox.length} new` : 'empty'}</span><span class="num"></span></div>
          ${counts.map((c) => `<div class="lrow"><span>${esc(c.title)}</span><span class="num">${plural(c.m, 'file', 'files')}</span><span class="num">${c.g} made</span></div>`).join('')}
        </div></section>
      <section class="panel"><div class="row between"><h2>Made for you</h2><button class="btn sm quiet" data-act="goto" data-v="study">Open</button></div>
        ${recent.length ? `<div class="list">${recent.map(genRow).join('')}</div>` : '<p class="muted">Nothing yet. Make flashcards, a summary or a practice test from your materials</p>'}</section>
    </div>
    <form class="panel" id="ask-form"><label class="field">Ask about ${esc(ix.name)}<input type="text" id="ask-q" placeholder="What does the exam usually ask about system operations"></label>
      <p class="muted">Claude searches every part of this subject, starting where the question belongs</p></form>`;
}

// ---------- one exam part: its own dashboard ----------
function viewPart() {
  const ix = cur(), p = partOf(S.part);
  if (!p) return viewOverview();
  const done = p.status === 'done' && p.score != null, d = daysTo(p.date);
  const tests = p.generated.filter((x) => x.kind === 'test'), study = p.generated.filter((x) => x.kind !== 'test');
  const counts = { good: 0, learning: 0, weak: 0, 'not started': 0 };
  for (const t of p.topics) counts[t.status in counts ? t.status : 'not started']++;
  const covered = p.topics.length ? Math.round(((p.topics.length - counts['not started']) / p.topics.length) * 100) : 0;
  return `<div class="row between"><div class="head"><h1>${esc(p.name)}</h1>
      <p class="meta">${p.format ? esc(p.format) + ' · ' : ''}${num(p.points)} points · ${p.date ? `${esc(new Date(p.date).toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' }))}${d !== null && d >= 0 ? ` · in ${d} days` : ''}` : 'date not set'}</p></div>
      <button class="btn" data-act="edit-part">${S.editPart ? 'Close' : 'Edit date and score'}</button></div>
    ${S.editPart ? `<form class="panel" id="part-form"><div class="grid2">
      <label class="field">Exam date<input type="date" id="p-date" value="${esc(p.date ?? '')}"></label>
      <label class="field">Status<select id="p-status">${STATUS.map((x) => `<option ${p.status === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      <label class="field">Points earned<input type="number" id="p-score" min="0" max="${num(p.points)}" step="0.5" value="${p.score ?? ''}" placeholder="when it is done"></label>
      <label class="field">Format<input type="text" id="p-format" value="${esc(p.format ?? '')}" placeholder="theory test, code on paper"></label></div>
      <div class="row"><button class="btn primary" type="submit">Save</button></div></form>` : ''}
    <div class="stats">
      <div class="stat"><span>Status</span><b style="font-size:20px;line-height:28px" class="status">${dot(p.status)}${esc(p.status)}</b></div>
      <div class="stat"><span>${done ? 'Earned' : 'Best practice'}</span><b>${done ? num(p.score) : p.best != null ? num(p.best) : '—'}<span class="muted" style="font:14px var(--font)"> / ${num(p.points)}</span></b></div>
      <div class="stat"><span>Topics covered</span><b>${p.topics.length ? `${covered}%` : '—'}</b></div>
      <div class="stat"><span>Tests taken</span><b>${p.results.length}</b></div>
    </div>
    <section class="panel tight">
      <div class="row between" style="padding:16px 16px 8px"><h2>Topics</h2><span class="meta">${p.topics.length ? `${counts.good} good · ${counts.learning} learning · ${counts.weak} weak · ${counts['not started']} not started` : ''}</span></div>
      ${p.topics.length ? `<div class="topics">${p.topics.map((t) => `<div class="topic">${dot(t.status)}
          <div class="nm"><span>${esc(t.name)}</span><small>${esc(t.status)}${t.lastTested ? ` · tested ${esc(fmtDate(t.lastTested))}` : ''}${t.source ? ` · ${esc(t.source)}` : ''}</small></div>
          <div class="mastery ${esc(t.status)}" title="Mastery ${num(t.mastery)}%"><b style="width:${Math.max(0, Math.min(100, num(t.mastery)))}%"></b></div>
          <span class="meta" style="text-align:right">${num(t.mastery)}%</span>
          <button class="btn sm quiet act" data-act="topic-quiz" data-t="${esc(t.name)}">Practise</button></div>`).join('')}</div>`
        : `<div class="empty"><p>No topic map yet. Claude builds one from this part's materials: the areas the exam covers, so every card and test question is filed under its topic</p>
          <button class="btn" data-act="build-topics" ${p.materials.length || ix.shared.materials.length ? '' : 'disabled'}>Build the topic map</button></div>`}
    </section>
    <div class="cols">
      <section class="panel"><div class="row between"><h2>Tests</h2><button class="btn sm primary" data-act="mock-exam" data-p="${esc(p.name)}">Mock exam</button></div>
        ${tests.length ? `<div class="list">${tests.map(genRow).join('')}</div>` : '<p class="muted">No tests yet</p>'}
        ${p.results.length ? `<h3>Results</h3><div class="list">${p.results.slice().reverse().map((r) => `<div class="item"><span class="ic">${icon('chart')}</span>
          <button class="name" data-act="open-file" data-id="${esc(r.id)}" data-n="${esc(r.name)}"><b>${esc(r.name)}</b><small>${esc(fmtDate(r.date))}</small></button>
          <span class="pts">${num(r.score)} / ${num(r.total)}</span></div>`).join('')}</div>` : ''}</section>
      <section class="panel"><div class="row between"><h2>Study</h2><button class="btn sm" data-act="make" data-p="${esc(p.name)}">${icon('plus')}Make</button></div>
        ${study.length ? `<div class="list">${study.map(genRow).join('')}</div>` : '<p class="muted">No flashcards or notes yet</p>'}</section>
    </div>
    <section class="section"><div class="group-h"><h2>Materials</h2><span class="meta">${plural(p.materials.length, 'file', 'files')}</span></div>
      ${p.materials.length ? `<div class="panel tight list">${p.materials.map((f) => fileRow(f)).join('')}</div>` : '<p class="muted" style="padding:0 4px">Nothing filed here yet. Drop documents in the inbox and Claude sorts them</p>'}</section>`;
}

// ---------- materials ----------
function fileRow(f, selectable = true) {
  const sel = S.selected.has(f.id);
  return `<div class="item ${selectable ? 'sel' : ''}">${selectable ? `<input type="checkbox" data-act="select" data-id="${esc(f.id)}" data-n="${esc(f.name)}" ${sel ? 'checked' : ''} aria-label="Select ${esc(f.name)}">` : ''}
    <span class="ic">${icon(KIND_ICON[f.kind] ?? 'file')}</span>
    <button class="name" data-act="open-file" data-id="${esc(f.id)}" data-n="${esc(f.name)}"><b>${esc(f.name)}</b>${f.note ? `<small>${esc(f.note)}</small>` : ''}</button>
    <span class="side"><span class="tag">${esc(f.kind ?? '')}</span><span class="meta">${esc(fmtSize(f.size))}</span></span></div>`;
}
function viewMaterials() {
  const ix = cur(), n = ix.inbox.length;
  return `<div class="head"><h1>Materials</h1><p class="sub">Everything for ${esc(ix.name)}, sorted by exam part</p></div>
    <section class="inbox ${n ? 'full' : ''}">
      <div class="stack" style="gap:6px">${n ? `<span class="count">${n}</span><p>${plural(n, 'new document', 'new documents')} in the inbox. Claude reads each one, proposes a name and where it belongs, and moves them once you approve</p>`
        : `<h2>Inbox</h2><p class="sub">Drop every document for this subject here: scripts, slides, old exams, photos of notes. You do not have to sort anything</p>`}</div>
      <div class="row">${n ? `<button class="btn primary" data-act="sort">Sort with Claude</button>` : ''}
        ${ix.inboxUrl ? `<button class="btn" data-act="open-inbox">${icon('ext')}Open inbox in storage</button>` : ''}
        ${n ? '' : `<button class="btn quiet" data-act="refresh">Check again</button>`}</div>
    </section>
    ${n ? `<div class="panel tight list">${ix.inbox.map((f) => fileRow(f, false)).join('')}</div>` : '<p class="muted">You can also attach files in the chat and say "put these in the inbox"</p>'}
    ${groups(ix).map((g) => `<section class="section">
      <div class="group-h"><h2>${esc(g.title)}</h2><span class="meta">${plural(g.materials.length, 'file', 'files')}${g.points ? ` · ${num(g.points)} points` : ''}</span></div>
      ${g.materials.length ? `<div class="panel tight list">${g.materials.map((f) => fileRow(f)).join('')}</div>` : `<p class="muted" style="padding:0 4px">Nothing here yet</p>`}
    </section>`).join('')}
    ${S.selected.size ? `<div class="selbar"><span>${plural(S.selected.size, 'file', 'files')} selected</span><div class="row">
      <button class="btn quiet" data-act="clear-sel">Clear</button><button class="btn primary" data-act="make" data-p="">Make from these</button></div></div>` : ''}`;
}

// ---------- study ----------
function genRow(x) {
  return `<div class="item"><span class="ic">${icon(KIND_ICON[x.kind] ?? 'note')}</span>
    <button class="name" data-act="open-file" data-id="${esc(x.id)}" data-n="${esc(x.name)}"><b>${esc(x.name)}</b><small>${esc(x.part ?? '')}${x.part && x.kind ? ' · ' : ''}${esc(x.kind ?? '')}</small></button>

// simple spaced repetition (SM-2 style): days until the card comes back
function sched(s, r) {
  const prev = s ?? { interval: 0, ease: 2.5, reps: 0 };
  let { interval, ease, reps } = prev;
  if (r === 'again') { interval = 0; ease = Math.max(1.3, ease - 0.2); reps = 0; }
  else if (r === 'hard') { interval = Math.max(1, Math.round((interval || 1) * 1.2)); ease = Math.max(1.3, ease - 0.15); reps++; }
  else if (r === 'good') { interval = reps === 0 ? 1 : reps === 1 ? 3 : Math.round(interval * ease); reps++; }
  else { interval = reps === 0 ? 3 : Math.round((interval || 1) * ease * 1.3); ease += 0.15; reps++; }
  const due = new Date(Date.now() + interval * 86400000).toISOString().slice(0, 10);
  return { interval, ease: Math.round(ease * 100) / 100, reps, due };
}
const next = (s, r) => { const d = sched(s, r).interval; return d === 0 ? '<1 min' : d === 1 ? '1 day' : `${d} days`; };

function openTest(t) {

function fixQuestion(q, n) {

// objective questions are scored here; open, practical and code go to Claude
function autoScore(q, a) {

  switch (q.type) {

    case 'fill': { const keys = Object.keys(q.blanks ?? {}); if (!keys.length) return null; const ok = keys.filter((k) => (q.blanks[k] ?? []).map(norm).includes(norm(a?.[k]))).length; return Math.round((pts * ok / keys.length) * 100) / 100; }

}

function submitTest() {
  const t = S.test; if (!t || S.submitted) return;
  const items = t.questions.map((q) => ({ id: q.id, type: q.type, answer: S.answers[q.id] ?? null, auto: autoScore(q, S.answers[q.id]), max: Number(q.points ?? 1) }));
  const auto = items.filter((i) => i.auto !== null), manual = items.filter((i) => i.auto === null);
  S.submitted = true;
  S.results = { pending: true, test: t.title, autoScore: auto.reduce((s, i) => s + i.auto, 0), autoMax: auto.reduce((s, i) => s + i.max, 0), manualCount: manual.length,
    items: t.questions.map((q, n) => ({ id: q.id, n: n + 1, prompt: String(q.prompt ?? '').replace(/\[\[\w+\]\]/g, '___'), points: items[n].auto, max: items[n].max, pending: items[n].auto === null })) };
  const mins = Math.round((Date.now() - S.started) / 60000);
  ask(`grade my test "${t.title}"${S.subject ? ` in "${S.subject}"` : ''} (${mins} min). Objective questions are auto-scored in the window: ${S.results.autoScore}/${S.results.autoMax}. ` +
    `Grade the ${manual.length} open/practical/code answers with the grading guide, check the auto-scores, save the result, update memory, push results and then the refreshed subject. ` +
    `Answers JSON: ${JSON.stringify(items)}`);
  go('result');
}
function viewResult() {
  const r = S.results;
  if (!r) return `<div class="empty"><p>No result open</p></div>`;
  const score = r.score ?? r.autoScore, total = r.total ?? r.autoMax;
  const items = arr(r.items).map((i, n) => {
    const cls = i.pending ? '' : num(i.points) >= num(i.max) ? 'full' : num(i.points) === 0 ? 'zero' : '';
    return `<div class="item" style="grid-template-columns:minmax(0,1fr) auto"><div class="name"><b style="white-space:normal">${esc(i.n ?? n + 1)}. ${esc(i.prompt ?? i.id)}</b>${i.feedback ? `<small style="white-space:normal">${esc(i.feedback)}</small>` : ''}</div>
      <span class="pts ${cls}">${i.pending ? 'grading' : `${num(i.points)} / ${num(i.max)}`}</span></div>`;
  }).join('');
  return `<div class="head"><h1>${esc(r.test ?? 'Result')}</h1></div>
    <section class="panel"><div class="score"><b>${esc(num(score))}</b><span class="muted">of ${esc(num(total))} points${r.pending ? ' so far' : ''}${r.grade ? ` · ${esc(r.grade)}` : ''}</span></div>
    ${r.pending ? `<p class="muted">Claude is grading ${plural(num(r.manualCount), 'answer', 'answers')}. If you solved anything on paper, attach a photo in the chat now</p>` : ''}
    ${arr(r.weakTopics).length ? `<p>Work on: ${arr(r.weakTopics).map(esc).join(', ')}</p><div class="row"><button class="btn primary" data-act="weak">Practise these</button></div>` : ''}</section>
    ${arr(r.topics).length ? `<section class="panel"><h2>By topic</h2><div class="topics">${arr(r.topics).map((t) => { const pc = num(t.total) ? Math.round((num(t.score) / num(t.total)) * 100) : 0, st = pc >= 70 ? 'good' : pc < 50 ? 'weak' : 'learning';
      return `<div class="topic" style="grid-template-columns:12px minmax(0,1fr) 160px 72px">${dot(st)}<div class="nm"><span>${esc(t.name)}</span></div><div class="mastery ${st}"><b style="width:${pc}%"></b></div><span class="pts" style="text-align:right">${num(t.score)} / ${num(t.total)}</span></div>`; }).join('')}</div></section>` : ''}
    <section class="panel tight list">${items}</section>`;
}

// ---------- mistakes ----------
function reportButton(title, id) { return `<button class="btn quiet" data-act="report" data-t="${esc(title)}" data-id="${esc(id)}">Report a mistake</button>`; }
function reportBox() {
  if (!S.report) return '';
  return `<form class="panel" id="report-form"><label class="field">What is wrong<textarea id="r-note" required placeholder="The answer uses a different definition than the script, page 14"></textarea></label>
    <div class="row"><button class="btn primary" type="submit">Send to Claude</button><button class="btn quiet" type="button" data-act="report-cancel">Cancel</button></div></form>`;
}

// ---------- events ----------
const where = () => (S.subject ? ` in "${S.subject}"` : '');
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.matches('input[type=checkbox][data-act^="prop"], select, input[type=text]')) return;
  const d = el.dataset;
  switch (d.act) {
    case 'goto': return go(d.v || 'overview');
    case 'full': return toggleFull();
    case 'go-setup': S.setup.step = 0; return go('setup');
    case 'setup-next': S.setup.step++; return render();
    case 'setup-back': S.setup.step = Math.max(0, S.setup.step - 1); return render();
    case 'pick-storage': S.setup.storage = d.s; store.set('storage', d.s); return render();
    case 'open-connectors': return link('https://claude.ai/customize/connectors');
    case 'check-storage': toast('Asked Claude to check ' + S.setup.storage);
      return ask(`setup. storage=${S.setup.storage}. Read the setup guide, check that this storage connector works, create the Studying workspace if it is missing, then push setup_status and subjects.`);
    case 'load-subjects': return ask('list my subjects from the Studying workspace and push them (kind subjects) with parts, exam date, readiness and cards due today. If there is no workspace, push setup_status with ok false.');
    case 'new-subject': { if (S.view !== 'subjects') go('subjects'); const b = $('new-subject'); if (b) { b.hidden = !b.hidden; $('f-name')?.focus(); } return; }
    case 'pick-subject': S.selected.clear(); if (S.data[d.s]) { S.subject = d.s; store.set('subject', d.s); return go('overview'); } return loadSubject(d.s);
    case 'refresh': return loadSubject(S.subject, 'refresh');
    case 'open-part': S.part = d.p; S.editPart = false; return go('part');
    case 'edit-part': S.editPart = !S.editPart; return render();
    case 'build-topics': toast('Claude is reading the materials');
      return ask(`build the topic map for the part "${S.part}" of "${S.subject}" (guide: generation, "Topics first"). Use this part's materials and _shared, save it in subject.json and push the subject.`);
    case 'topic-quiz': return ask(`make a short practice quiz on the topic "${d.t}" of the part "${S.part}" in "${S.subject}". Every question gets topic "${d.t}". Review it, then push it (kind test).`);
    case 'open-inbox': { const u = cur()?.inboxUrl; if (u) return link(u); return go('materials'); }
    case 'sort': toast('Claude is reading the inbox');
      return ask(`sort the inbox of "${S.subject}" (guide: intake). Read every file in _inbox, then push a proposal (kind proposal). Do not move anything yet.`);
    case 'apply-sort': {
      const p = S.proposal, plan = p.items.filter((x) => x.include && x.to !== 'skip').map((x) => ({ id: x.id, name: x.name, newName: x.newName ?? x.name, to: x.to }));
      toast('Claude is moving the files');
      ask(`apply sorting in "${S.subject}" (guide: intake, step 5). Approved plan JSON: ${JSON.stringify(plan)}. Learned facts to save: ${JSON.stringify(arr(p.learned))}. Then push the refreshed subject.`);
      S.proposal = null; return go('materials');
    }
    case 'make': S.back = SECTIONS.some((s) => s[0] === S.view) ? S.view : 'overview'; S.makePart = d.p && d.p !== '_shared' ? d.p : ''; S.makePreset = ''; return go('make');
    case 'make-test': S.back = 'practice'; S.makePart = d.p ?? ''; S.makePreset = 'test'; return go('make');
    case 'clear-sel': S.selected.clear(); return render();
    case 'select': if (el.checked) S.selected.set(d.id, d.n); else S.selected.delete(d.id); return render();
    case 'open-file': S.back = SECTIONS.some((s) => s[0] === S.view) ? S.view : S.back;
      return ask(`open "${d.n}"${d.id ? ` (id ${d.id})` : ''}${where()} and push it: decks, tests and mind maps as their kind, results as results, anything else as a document with a readable version of its content.`);
    case 'list': S.path = d.p; S.files = null; go('files'); return ask(`list files in "${d.p}" and push them (kind files).`);
    case 'next-step': S.back = 'overview'; return ask(`what should I study next${where()}? Use memory.md, results and what is due, then push it as a document (kind plan).`);
    case 'due-cards': return ask(`collect the flashcards that are due today${where()} (from *.progress.json) into one deck and push it.`);
    case 'mock-exam': return ask(`make a mock exam${where()}${d.p ? ` for the part "${d.p}"` : ''} in the real exam format from subject.md and part.md (question types, points, time). Review it first, then push it (kind test).`);
    case 'weak': return ask(`make a practice quiz on my weak topics${where()}: ${arr(S.results?.weakTopics ?? cur()?.memory.weakTopics).join(', ')}. Review it, then push it (kind test).`);
    case 'flip': S.flipped = !S.flipped; return render();
    case 'rate': { const i = S.order[S.idx], c = S.deck.cards[i]; S.srs[c.id] = sched(S.srs[c.id], d.r); store.set('srs:' + S.deck.title, S.srs);
      if (d.r === 'again') S.order.push(i); S.idx++; S.flipped = false; return render(); }
    case 'prev-card': S.idx = Math.max(0, S.idx - 1); S.flipped = false; return render();
    case 'next-card': S.idx++; S.flipped = false; return render();
    case 'restart-deck': S.order = S.deck.cards.map((_, i) => i); S.idx = 0; S.flipped = false; return render();
    case 'save-srs': toast('Sent to Claude to save');
      return ask(`save my flashcard progress for deck "${S.deck?.title}"${where()} to its .progress.json and update memory.md. Progress JSON: ${JSON.stringify(S.srs)}`);
    case 'export-csv': return exportCsv();
    case 'tree-all': document.querySelectorAll('.tree details').forEach((x) => (x.open = d.open === '1')); return;
    case 'goto-q': S.q = Number(d.i); return render();
    case 'prev-q': S.q = Math.max(0, S.q - 1); return render();
    case 'next-q': S.q = Math.min(S.test.questions.length - 1, S.q + 1); return render();
    case 'move': { const q = S.test.questions[S.q], a = S.answers[q.id], i = Number(d.pos), j = i + Number(d.d); [a[i], a[j]] = [a[j], a[i]]; S.touched.add(q.id); return render(); }
    case 'submit-test': return submitTest();
    case 'report': S.report = { title: d.t, id: d.id }; render(); $('r-note')?.focus(); return;
    case 'report-cancel': S.report = null; return render();
  }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset;
  if (d.act === 'pick-storage') { S.setup.storage = d.s; store.set('storage', d.s); return render(); }
  if (d.act === 'prop-inc') { S.proposal.items[d.i].include = el.checked; return render(); }
  if (d.act === 'prop-to') { const x = S.proposal.items[d.i]; x.to = el.value; x.include = el.value !== 'skip'; return render(); }
  if (!S.test || S.view !== 'test') return;
  const q = S.test.questions[S.q];
  if (d.act === 'ans-single') S.answers[q.id] = q.type === 'truefalse' ? Number(d.i) === 0 : Number(d.i);
  else if (d.act === 'ans-multi') { const s = new Set(S.answers[q.id] ?? []); el.checked ? s.add(Number(d.i)) : s.delete(Number(d.i)); S.answers[q.id] = [...s]; }
  else if (d.act === 'ans-match') { S.answers[q.id] = { ...(S.answers[q.id] ?? {}) }; S.answers[q.id][d.i] = el.value === '' ? '' : Number(el.value); }
  else return;
  render();
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'prop-name') { S.proposal.items[el.dataset.i].newName = el.value; return; }
  if (!S.test) return;
  const q = S.test.questions[S.q];
  if (el.dataset.act === 'ans-text') S.answers[q.id] = el.value;
  if (el.dataset.act === 'ans-fill') S.answers[q.id] = { ...(S.answers[q.id] ?? {}), [el.dataset.k]: el.value };
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const id = e.target.id, val = (x) => ($(x)?.value ?? '').trim();
  if (id === 'subject-form') {
    const name = val('f-name'); if (!name) return;
    S.subject = name; store.set('subject', name); S.loading = name;
    toast('Claude is creating ' + name);
    S.view = 'overview'; render();
    return ask(`create a new subject "${name}". Parts: ${val('f-parts') || 'none given'}. Exam date: ${val('f-date') || 'unknown'}. Grading: ${val('f-notes') || 'not given'}. ` +
      'Create the folders (parts, _inbox, _shared), subject.md, memory.md and subject.json (guides: storage-layout, subject), then push subjects and the subject.');
  }
  if (id === 'part-form') {
    const p = partOf(S.part); if (!p) return;
    const upd = { date: val('p-date') || null, status: $('p-status').value, score: val('p-score') === '' ? null : num(val('p-score')), format: val('p-format') || p.format || null };
    Object.assign(p, upd); S.editPart = false; render(); toast('Saved. Claude is updating your storage');
    return ask(`update the part "${p.name}" of "${S.subject}": ${JSON.stringify(upd)}. Write it to subject.json and subject.md (keep every other field), then push the subject.`);
  }
  if (id === 'ask-form') {
    const q = val('ask-q'); if (!q) return; $('ask-q').value = '';
    return ask(`ask about "${S.subject}": ${q}. Answer in the chat; search the right part first, then the other parts and _shared, and cite file and page.`);
  }
  if (id === 'tell-form') {
    const t = val('tell-t'); if (!t) return; $('tell-t').value = '';
    toast('Saved to notes');
    return ask(`note for "${S.subject}": "${t}". Add it to subject.md or memory.md (whichever fits), then push the refreshed subject.`);
  }
  if (id === 'make-form') {
    const f = e.target;
    const outputs = [...f.querySelectorAll('input[name=out]:checked')].map((x) => x.value);
    const types = [...f.querySelectorAll('input[name=qt]:checked')].map((x) => x.value);
    if (!outputs.length) return toast('Choose at least one thing to make');
    const c = { outputs, types, count: num(val('m-count')) || 15, difficulty: $('m-diff').value, time: num(val('m-time')), points: num(val('m-points')), review: $('m-review').checked };
    if (S.makePreset !== 'test') store.set('create', c);
    const part = $('m-part').value;
    const only = $('m-only')?.checked && S.selected.size;
    const testy = outputs.some((o) => /Quiz|test/.test(o));
    const job = {
      subject: S.subject, part: part || 'whole subject',
      from: only ? [...S.selected.entries()].map(([fid, n]) => ({ id: fid, name: n })) : (part ? `all materials of "${part}", plus _shared; look in the other parts when something is missing` : 'all materials of the subject'),
      focus: val('m-focus') || null, make: outputs,
      questions: testy ? { types, count: c.count, difficulty: c.difficulty, timeLimitMin: c.time, totalPoints: c.points } : undefined,
      review: c.review, note: val('m-note') || null,
    };
    S.selected.clear(); toast('Claude is on it');
    go(S.back || 'overview');
    return ask(`make study material (guides: generation${testy ? ', question-types' : ''}, review, formats). ` +
      'Report each step with study_progress, save to the part\'s generated/ folder (or _shared/generated), push each result and then the refreshed subject. Job: ' + JSON.stringify(job));
  }
  if (id === 'report-form') {
    const note = val('r-note'); if (!note) return;
    const r = S.report; S.report = null; render(); toast('Sent to Claude');
    return ask(`report a mistake in "${r.title}"${r.id ? `, item ${r.id}` : ''}${where()}: "${note}". Fix it, push the corrected item and follow the fixer guide.`);
  }
});
document.addEventListener('keydown', (e) => {
  if (S.view !== 'deck' || !S.deck || e.target.closest('input, textarea, select')) return;
  if (e.code === 'Space') { e.preventDefault(); S.flipped = !S.flipped; render(); }
  else if (e.key === 'ArrowRight') { S.idx++; S.flipped = false; render(); }
  else if (e.key === 'ArrowLeft') { S.idx = Math.max(0, S.idx - 1); S.flipped = false; render(); }
});
setInterval(() => {
  if (!S.test || S.submitted) return;
  const left = timeLeft(), el = $('timer'); if (left === null) return;
  if (left === 0) { toast('Time is up. Your answers were submitted'); return submitTest(); }
  if (!el) return;
  el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; el.classList.toggle('low', left < 300);
}, 1000);

function exportCsv() {
  const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const csv = 'front,back,source\n' + S.deck.cards.map((c) => [c.front, c.back, c.source].map(q).join(',')).join('\n');
  const name = (S.deck.title || 'deck').replace(/[^\w-]+/g, '-') + '.csv';
  app.downloadFile({ contents: [{ type: 'resource', resource: { uri: `file:///${name}`, mimeType: 'text/csv', text: csv } }] })
    .then((r) => { if (r?.isError) throw 0; }).catch(() => toast('Downloads are not allowed here. Ask Claude to save the CSV to your storage'));
}

// ---------- display ----------
async function toggleFull() {
  const target = S.display === 'fullscreen' ? 'inline' : 'fullscreen';
  try { const r = await app.requestDisplayMode({ mode: target }); S.display = r?.mode ?? target; } catch {}
  render();
}
function hostContext(ctx) {
  if (!ctx) return;
  if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
  if (ctx.styles?.variables) for (const [k, v] of Object.entries(ctx.styles.variables)) if (v) document.documentElement.style.setProperty(k, v);
  if (ctx.displayMode) S.display = ctx.displayMode;
  if (ctx.availableDisplayModes) S.modes = ctx.availableDisplayModes;
  const sa = ctx.safeAreaInsets;
  if (sa) { document.documentElement.style.setProperty('--top', `${Math.max(0, Number(sa.top) || 0)}px`); document.documentElement.style.setProperty('--bottom', `${Math.max(0, Number(sa.bottom) || 0)}px`); }
  const h = ctx.containerDimensions?.maxHeight ?? ctx.containerDimensions?.height;
  if (S.display === 'fullscreen' && h) document.documentElement.style.setProperty('--h', `${h}px`);
  else document.documentElement.style.removeProperty('--h');
}
app.onhostcontextchanged = (ctx) => { hostContext({ ...app.getHostContext(), ...ctx }); render(); };
app.ontoolinput = ({ arguments: a }) => {
  if (a?.session && /^[A-Za-z0-9_-]{12,64}$/.test(a.session)) S.session = a.session;
  if (a?.view) S.view = { document: 'doc', home: 'subjects', subject: 'overview' }[a.view] ?? a.view;
  for (const m of [].concat(a?.data ?? [])) if (m?.kind) receive({ kind: m.kind, title: m.title, payload: m.payload });
  render();
};
// test hook: lets a page without a host feed messages in (used by tests and local previews)
window.__studying = { receive: (m) => receive(m), go, S };
if (S.subject) S.view = 'overview';
render();
await app.connect();
connected = true;
hostContext(app.getHostContext());
render();
if (S.modes.includes('fullscreen') && S.display !== 'fullscreen') toggleFull();
startPolling();
</script>
</body>
</html>
