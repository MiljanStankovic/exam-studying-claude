<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studying</title>
<style>
  /* Direction
     Product   a study companion that keeps everything for one subject in one place and does the filing
     Character patient, exact, quietly encouraging
     World     a student's desk: a binder with a divider per exam part, index cards, a ruled margin
     Moments   the points track toward passing, and the index card itself
     Signature the red margin line of an index card (cards, questions, the sorting sheet)
     Structure subjects -> one subject (hub) -> one exam part; everything else opens over it */
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-secondary, #f7f7f6);
    --card: var(--color-background-primary, #ffffff);
    --raised: #f1f1f0;
    --t1: var(--color-text-primary, #191919);
    --t2: var(--color-text-secondary, #545454);
    --t3: var(--color-text-tertiary, #767676);
    --line: rgba(25, 25, 25, .08);
    --line2: rgba(25, 25, 25, .16);
    --accent: #2f5597;
    --on-accent: #ffffff;
    --accent-soft: rgba(47, 85, 151, .10);
    --ok: #237a4b; --bad: #c0362c;
    --paper: #fffef9;
    --margin: #c8463b;
    --scrim: rgba(20, 20, 20, .32);
    --font: var(--font-sans, "Inter", system-ui, -apple-system, "Segoe UI", sans-serif);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
    --ease: cubic-bezier(.22, 1, .36, 1);
    --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 8px 24px rgba(0, 0, 0, .06);
    --lift: 0 24px 64px rgba(0, 0, 0, .18);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: var(--color-background-secondary, #141415); --card: var(--color-background-primary, #19191b);
    --raised: #232325; --t1: var(--color-text-primary, #ededed); --t2: var(--color-text-secondary, #a1a1a6); --t3: var(--color-text-tertiary, #85858b);
    --line: rgba(237, 237, 237, .08); --line2: rgba(237, 237, 237, .16);
    --accent: #9fb9e6; --on-accent: #0e1420; --accent-soft: rgba(159, 185, 230, .12);
    --ok: #4cc38a; --bad: #e5484d; --paper: #1e1e20; --margin: #d9675c; --shadow: none; --scrim: rgba(0, 0, 0, .6); --lift: 0 24px 64px rgba(0, 0, 0, .5); } }
  :root[data-theme="dark"] {
    --raised: #232325; --line: rgba(237, 237, 237, .08); --line2: rgba(237, 237, 237, .16);
    --accent: #9fb9e6; --on-accent: #0e1420; --accent-soft: rgba(159, 185, 230, .12);
    --ok: #4cc38a; --bad: #e5484d; --paper: #1e1e20; --margin: #d9675c; --shadow: none; --scrim: rgba(0, 0, 0, .6); --lift: 0 24px 64px rgba(0, 0, 0, .5); }

  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--t1); font: 14px/20px var(--font); background: transparent; }
  body.full { background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  /* app frame */
  .app { position: relative; display: flex; flex-direction: column; min-height: 640px; height: var(--h, auto); background: var(--bg); border-radius: 12px; overflow: hidden;
    padding-top: var(--top, 0px); padding-bottom: var(--bottom, 0px); }
  body.full .app { height: 100vh; border-radius: 0; }
  .top { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 24px; flex: none; border-bottom: 1px solid var(--line); background: var(--card); position: relative; z-index: 3; }
  .mark { width: 16px; height: 20px; border: 1.5px solid var(--t2); border-radius: 3px; position: relative; flex: none; }
  .mark::before { content: ""; position: absolute; left: 3px; top: -1.5px; bottom: -1.5px; width: 1.5px; background: var(--margin); }
  .home { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; border-radius: 8px; font-weight: 500; font-size: 15px; }
  .home:hover { background: var(--raised); }
  .crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; color: var(--t3); }
  .crumbs .sep { padding: 0 2px; }
  .switch { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--t1); font-weight: 500; min-width: 0; max-width: 320px; }
  .switch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch:hover, .crumbs button:hover { background: var(--raised); }
  .crumbs button.part { height: 36px; padding: 0 10px; border-radius: 8px; color: var(--t1); }
  .spacer { flex: 1; }
  .menu { position: absolute; top: 52px; left: 64px; width: 300px; background: var(--card); border: 1px solid var(--line2); border-radius: 12px; box-shadow: var(--lift); padding: 6px; z-index: 5;
    animation: pop .18s var(--ease) both; display: grid; gap: 2px; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
  .menu button { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; text-align: left; width: 100%; }
  .menu button:hover { background: var(--raised); }
  .menu button[aria-current] { background: var(--raised); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu .meta { margin-left: auto; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .page { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; display: grid; gap: 24px; animation: rise .4s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  /* progress */
  .progress { margin: 16px auto 0; width: calc(100% - 48px); max-width: 1032px; padding: 12px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 8px; }
  .progress .row1 { display: flex; justify-content: space-between; gap: 12px; }
  .progress .job { font-weight: 500; }
  .progress .eta { color: var(--t3); font: 12px/20px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .track b { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s var(--ease); }
  .steps { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--t3); font-size: 12px; line-height: 16px; }
  .steps .now { color: var(--t1); } .steps .done { color: var(--t2); }

  /* type */
  h1 { font: 400 34px/1.15 var(--serif); margin: 0; letter-spacing: -.005em; text-wrap: balance; }
  h2 { font: 500 15px/20px var(--font); margin: 0; }
  h3 { font: 500 13px/16px var(--font); margin: 0; color: var(--t2); }
  p { margin: 0; }
  .sub { color: var(--t2); max-width: 64ch; }
  .muted { color: var(--t3); }
  .meta { color: var(--t3); font: 12px/16px var(--mono); font-variant-numeric: tabular-nums; }
  .head { display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .stack { display: grid; gap: 12px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .cols.wide { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }

  /* surfaces and controls */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; align-content: start; min-width: 0; box-shadow: var(--shadow); }
  .panel.tight { padding: 4px; gap: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; font-weight: 500;
    background: var(--card); border: 1px solid var(--line2); color: var(--t1); white-space: nowrap;
    transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease); }
  .btn:hover { background: var(--raised); }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn.quiet { background: none; border-color: transparent; color: var(--t2); padding: 0 10px; }
  .btn.quiet:hover { background: var(--raised); color: var(--t1); }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn .n { font: 12px/16px var(--mono); color: var(--accent); }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--t2); flex: none; }
  .icon-btn:hover:not(:disabled) { background: var(--raised); color: var(--t1); }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  input[type=text], input[type=number], input[type=date], select, textarea { background: var(--card); border: 1px solid var(--line2); border-radius: 8px; padding: 0 10px; height: 36px; min-width: 0; }
  textarea { width: 100%; min-height: 96px; padding: 8px 10px; resize: vertical; line-height: 20px; height: auto; }
  label.field { display: grid; gap: 6px; color: var(--t2); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--card); user-select: none; cursor: pointer;
    transition: border-color .15s var(--ease), background-color .15s var(--ease); }
  .chip input { margin: 0; accent-color: var(--accent); }
  .chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .tag { font: 12px/16px var(--mono); color: var(--t3); }
  .notice { border-radius: 10px; padding: 12px 16px; background: var(--card); border: 1px solid var(--line2); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* status dots */
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line2); flex: none; display: inline-block; }
  .dot.done, .dot.good { background: var(--ok); } .dot.studying, .dot.learning { background: var(--accent); }
  .dot.ready { background: var(--ok); opacity: .55; } .dot.weak { background: var(--bad); }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--t2); font-size: 13px; }

  /* subject cards on the home page */
  .subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .subject { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 12px; box-shadow: var(--shadow);
    transition: border-color .15s var(--ease); }
  .subject:hover { border-color: var(--line2); }
  .subject .name { font: 400 22px/1.25 var(--serif); }
  .subject.add { place-content: center; justify-items: center; color: var(--t2); border-style: dashed; box-shadow: none; min-height: 140px; }

  /* the moment: points toward passing */
  .points { display: grid; gap: 16px; }
  .points .big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .points .big b { font: 400 44px/1 var(--serif); }
  .bar { position: relative; height: 44px; display: flex; gap: 4px; }
  .seg { position: relative; height: 28px; border-radius: 6px; background: var(--raised); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
  .seg i { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); border-radius: 6px 0 0 6px; }
  .seg b { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 6px 0 0 6px; z-index: 1; }
  .seg span { position: absolute; left: 8px; right: 8px; top: 6px; font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; }
  .seg.lit span { color: var(--on-accent); }
  .passline { position: absolute; top: -4px; height: 36px; width: 2px; background: var(--margin); border-radius: 1px; z-index: 3; }
  .passline i { position: absolute; top: 38px; left: 50%; transform: translateX(-50%); font: 12px/16px var(--mono); font-style: normal; color: var(--margin); white-space: nowrap; }
  .seg .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--margin); z-index: 3; }
  .rules { display: grid; gap: 0; }
  .rule { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 32px; border-top: 1px solid var(--line); }
  .rule:first-child { border-top: 0; }
  .rule .ok { color: var(--ok); } .rule .no { color: var(--t3); }
  .next { display: grid; gap: 12px; align-content: space-between; }
  .next p { font: 400 19px/1.4 var(--serif); }

  /* exam part cards on the subject page */
  .apps { display: grid; gap: 20px; }
  .appgroup { display: grid; gap: 12px; }
  .appgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .app-tile { display: grid; justify-items: start; align-content: start; gap: 8px; min-height: 128px; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font: inherit; color: inherit; text-align: left; transition: transform .12s, border-color .12s; }
  .app-tile:hover { border-color: var(--accent); transform: translateY(-1px); }
  .app-tile b { font-weight: 600; line-height: 1.25; }
  .app-tile .meta { font-size: 12px; }
  .app-ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
  .app-ic svg { width: 20px; height: 20px; }
  .k-test .app-ic { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .k-deck .app-ic { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  @media (prefers-reduced-motion: reduce) { .app-tile { transition: none; } .app-tile:hover { transform: none; } }
  .mats { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .mat { display: grid; gap: 6px; text-align: left; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font: inherit; color: inherit; }
  .mat:hover { border-color: var(--accent); }
  .mat .k { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .mat b { font-weight: 600; line-height: 1.3; }
  .mat .meta { font-size: 12px; }
  .mat.off { opacity: .72; }
  .parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .partcard { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; box-shadow: var(--shadow); align-content: start;
    transition: border-color .15s var(--ease); }
  .partcard:hover { border-color: var(--line2); }
  .partcard .name { font: 400 22px/1.25 var(--serif); }
  .partcard .score { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
  .partcard .score b { font: 400 28px/1 var(--serif); }
  .tdots { display: flex; flex-wrap: wrap; gap: 4px; }
  .tdots .dot { width: 10px; height: 10px; border-radius: 3px; }
  .partcard .foot { display: flex; justify-content: space-between; color: var(--t3); font: 12px/16px var(--mono); }

  /* lists */
  .list { display: grid; }
  .item { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 44px; padding: 8px 12px; border-radius: 10px; width: 100%; text-align: left; }
  .item.sel { grid-template-columns: 20px 20px minmax(0, 1fr) auto; }
  .item + .item { box-shadow: 0 -1px 0 var(--line); }
  .item:hover { background: var(--raised); box-shadow: none; }
  .item:hover + .item { box-shadow: none; }
  .item .name { min-width: 0; display: grid; gap: 2px; text-align: left; }
  .item .name b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .name small { color: var(--t3); font-size: 12px; line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .side { display: flex; align-items: center; gap: 12px; color: var(--t3); }
  .item input[type=checkbox] { margin: 0; accent-color: var(--accent); }
  .item .ic { color: var(--t3); display: grid; place-items: center; }
  .empty { padding: 16px 12px; color: var(--t3); display: grid; gap: 12px; justify-items: start; }
  .panel > .empty { padding: 0; }

  /* topics on the part page */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; display: grid; gap: 8px; box-shadow: var(--shadow); }
  .stat b { font: 400 28px/1 var(--serif); font-variant-numeric: tabular-nums; }
  .stat span { color: var(--t3); font-size: 13px; }
  .topics { display: grid; }
  .topic { display: grid; grid-template-columns: 12px minmax(0, 1fr) 160px 48px auto; gap: 12px; align-items: center; min-height: 48px; padding: 8px 12px; }
  .topic + .topic { border-top: 1px solid var(--line); }
  .topic .nm { display: grid; gap: 2px; min-width: 0; }
  .topic .nm small { color: var(--t3); font-size: 12px; line-height: 16px; }
  .mastery { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
  .mastery b { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .mastery.weak b { background: var(--bad); } .mastery.good b { background: var(--ok); }

  /* inbox strip */
  .inbox { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 20px; border-radius: 14px; border: 1.5px dashed var(--line2); background: var(--card); }
  .inbox.full { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
  .inbox .count { font: 400 32px/1 var(--serif); font-variant-numeric: tabular-nums; }

  /* overlays: everything that is not a place opens over the place */
  .overlay { position: absolute; inset: 0; z-index: 10; background: var(--scrim); display: grid; place-items: center; padding: 24px; animation: fade .2s var(--ease) both; }
  @keyframes fade { from { opacity: 0; } }
  .modal { width: min(880px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--bg); border-radius: 18px; box-shadow: var(--lift); overflow: hidden;
    animation: rise .3s var(--ease) both; border: 1px solid var(--line); }
  .modal.narrow { width: min(560px, 100%); }
  .modal header { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px 0 24px; border-bottom: 1px solid var(--line); background: var(--card); flex: none; }
  .modal header .t { flex: 1; min-width: 0; display: grid; }
  .modal header .t b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal header .t small { color: var(--t3); font-size: 12px; line-height: 16px; }
  .mbody { overflow-y: auto; padding: 24px; display: grid; gap: 20px; align-content: start; }

  /* index card: the signature */
  .card { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 24px 24px 24px 52px; box-shadow: var(--shadow); }
  .card::before { content: ""; position: absolute; left: 32px; top: 0; bottom: 0; width: 1.5px; background: var(--margin); opacity: .7; }
  .card .q { font: 400 21px/1.45 var(--serif); }
  .card .a { font: 400 16px/1.6 var(--serif); }
  .card .src { font: 12px/16px var(--mono); color: var(--t3); }
  .flash { min-height: 300px; display: grid; align-content: center; gap: 16px; cursor: pointer; }
  .flash.back { align-content: start; }
  .rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .rate .btn { height: 52px; flex-direction: column; gap: 2px; }
  .rate small { color: var(--t3); font: 12px/16px var(--mono); }

  /* sorting sheet */
  .sheet { display: grid; padding: 8px 8px 8px 44px; }
  .sheet .srow { display: grid; grid-template-columns: 20px minmax(0, 1fr) 96px 180px; gap: 12px; align-items: center; padding: 12px 12px 12px 16px; }
  .sheet .srow + .srow { border-top: 1px solid var(--line); }
  .sheet .srow.skip { opacity: .55; }
  .sheet .srow input[type=text] { width: 100%; height: 32px; }
  .sheet .srow select { height: 32px; width: 100%; }
  .sheet .why { grid-column: 2 / -1; color: var(--t3); font-size: 13px; margin-top: -4px; }
  .sheet .srow input[type=checkbox] { accent-color: var(--accent); margin: 0; }

  /* markdown */
  .md { display: grid; gap: 8px; }
  .md h2, .md h3 { font-family: var(--serif); font-weight: 400; color: var(--t1); }
  .md h2 { font-size: 20px; line-height: 28px; margin-top: 8px; } .md h3 { font-size: 17px; line-height: 24px; margin-top: 4px; }
  .md ul, .md ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  .md pre { margin: 0; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font: 13px/20px var(--mono); }
  .md code { font: 13px/20px var(--mono); background: var(--raised); padding: 1px 4px; border-radius: 4px; }
  .md pre code { background: none; padding: 0; }

  /* test */
  .qhead { display: flex; justify-content: space-between; gap: 12px; color: var(--t3); font: 12px/16px var(--mono); font-variant-numeric: tabular-nums; }
  .opts { display: grid; gap: 8px; }
  .opt { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--card); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; font: 16px/1.45 var(--serif); cursor: pointer; }
  .opt input { margin: 4px 0 0; accent-color: var(--accent); }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .blank { width: 9em; border: 0 !important; border-bottom: 1.5px solid var(--line2) !important; border-radius: 0 !important; background: transparent !important; padding: 0 2px !important; height: auto !important; font: inherit; }
  .match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; font: 16px/1.4 var(--serif); }
  .order { display: grid; gap: 6px; }
  .order div { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px; align-items: center; background: var(--card); border: 1px solid var(--line2); border-radius: 10px; padding: 4px 4px 4px 12px; font: 16px/1.4 var(--serif); }
  .order .icon-btn { width: 32px; height: 32px; }
  .timer { font: 500 14px/20px var(--mono); font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--bad); }
  .qnav { display: flex; flex-wrap: wrap; gap: 4px; }
  .qnav button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font: 12px/1 var(--mono); color: var(--t2); }
  .qnav button.ans { background: var(--raised); border-color: var(--line2); color: var(--t1); }
  .qnav button[aria-current] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--t1); }
  .score { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
  .score b { font: 400 48px/1 var(--serif); }
  .pts { font: 13px/20px var(--mono); font-variant-numeric: tabular-nums; color: var(--t2); }
  .pts.full { color: var(--ok); } .pts.zero { color: var(--bad); }

  /* user's own look (guide: customize) */
  :root[data-density="compact"] .page { gap: 16px; padding-top: 20px; }
  :root[data-density="compact"] .panel, :root[data-density="compact"] .partcard, :root[data-density="compact"] .subject { padding: 14px; gap: 12px; }
  :root[data-density="compact"] .item { min-height: 36px; padding: 4px 10px; }
  :root[data-density="compact"] .topic { min-height: 40px; padding: 4px 12px; }
  :root[data-density="compact"] h1 { font-size: 28px; }
  :root[data-radius="square"] .panel, :root[data-radius="square"] .partcard, :root[data-radius="square"] .subject, :root[data-radius="square"] .stat,
  :root[data-radius="square"] .modal, :root[data-radius="square"] .card, :root[data-radius="square"] .inbox, :root[data-radius="square"] .app { border-radius: 4px; }
  :root[data-radius="square"] .btn, :root[data-radius="square"] .chip, :root[data-radius="square"] input, :root[data-radius="square"] select, :root[data-radius="square"] textarea { border-radius: 4px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line2); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--t1); }
  input[type=color] { width: 40px; height: 32px; padding: 0 2px; border: 1px solid var(--line2); border-radius: 8px; background: var(--card); }

  /* mind map: drawn as a tree of branches */
  .mm { overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; max-height: 70vh; }
  .mm svg { display: block; }
  .mm .edge { fill: none; stroke: var(--line2); stroke-width: 1.5; }
  .mm .node rect { fill: var(--card); stroke: var(--line2); }
  .mm .node.root rect { fill: var(--accent); stroke: none; }
  .mm .node.root text { fill: var(--on-accent); }
  .mm .node.has { cursor: pointer; }
  .mm .node.has:hover rect { stroke: var(--accent); }
  .mm .node.shut rect { stroke: var(--accent); stroke-dasharray: 3 3; }
  .mm text { fill: var(--t1); font: 14px var(--serif); dominant-baseline: middle; }
  .mm .node text.k { fill: var(--t3); font: 11px var(--mono); }

  /* mind map outline */
  .tree { list-style: none; margin: 0; padding-left: 20px; border-left: 1px solid var(--line2); display: grid; gap: 2px; }
  .tree.root { border-left: 0; padding-left: 0; }
  .tree summary { cursor: pointer; padding: 4px 0; font: 16px/1.45 var(--serif); list-style: none; }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary::before { content: "+"; display: inline-block; width: 16px; color: var(--t3); font-family: var(--mono); }
  .tree details[open] > summary::before { content: "−"; }
  .tree .leaf { padding: 4px 0 4px 16px; font: 15px/1.45 var(--serif); color: var(--t2); }

  .toast { position: fixed; left: 50%; bottom: calc(16px + var(--bottom, 0px)); transform: translateX(-50%); background: var(--t1); color: var(--card); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); }
  .skeleton { display: grid; gap: 12px; }
  .skeleton i { display: block; height: 16px; border-radius: 4px; background: var(--raised); }

  @media (max-width: 760px) {
    .top { padding: 0 8px; }
    .home .lbl, .hide-sm { display: none; }
    .switch { max-width: 160px; padding: 0 6px; }
    .menu { left: 8px; right: 8px; width: auto; }
    .page { padding: 20px 16px 40px; gap: 20px; }
    .progress { width: calc(100% - 32px); }
    h1 { font-size: 28px; }
    .cols, .cols.wide { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .topic { grid-template-columns: 12px minmax(0, 1fr) 48px; }
    .topic .mastery, .topic .act { display: none; }
    .inbox { grid-template-columns: 1fr; }
    .overlay { padding: 0; }
    .modal, .modal.narrow { width: 100%; height: 100%; max-height: none; border-radius: 0; border: 0; }
    .mbody { padding: 16px; }
    .card { padding: 20px 16px 20px 40px; } .card::before { left: 24px; }
    .rate { grid-template-columns: repeat(2, 1fr); }
    .match { grid-template-columns: 1fr; }
    .sheet { padding-left: 32px; }
    .sheet .srow { grid-template-columns: 20px minmax(0, 1fr); }
    .sheet .srow > :nth-child(3), .sheet .srow > :nth-child(4) { grid-column: 2; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <div class="scroll" id="scroll">
    <section class="progress" id="progress" hidden aria-live="polite"></section>
    <div class="page" id="view"></div>
  </div>
  <div id="layer"></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<script type="module">
/*SDK*/
const { App } = window.__mcpApps;

// ---------- icons (lucide, 16px, 1.5 stroke) ----------
const ICON = {
  home: '<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  check: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  note: '<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13h6"/><path d="M9 17h4"/>',
  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  cards: '<rect x="3" y="6" width="15" height="13" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v10"/>',
  map: '<circle cx="12" cy="12" r="2"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M6.5 6.5l4 4M17.5 6.5l-4 4M6.5 17.5l4-4M17.5 17.5l-4-4"/>',
  test: '<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 14 2 2 4-4"/>',
  max: '<path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/>',
  min: '<path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/>',
  up: '<path d="m18 15-6-6-6 6"/>', down: '<path d="m6 9 6 6 6-6"/>', back: '<path d="m15 18-6-6 6-6"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
  ext: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
};

ICON.x = '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>';
ICON.chev = '<path d="m6 9 6 6 6-6"/>';
ICON.brain = '<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>';
const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n] ?? ICON.file}</svg>`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const arr = (x) => (Array.isArray(x) ? x : []);
const num = (x) => (Number.isFinite(Number(x)) ? Number(x) : 0);
const store = { get(k, d) { try { const v = localStorage.getItem('studying:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem('studying:' + k, JSON.stringify(v)); } catch {} } };

// ---------- library: generated material kept in this browser, so opening it needs no message to Claude ----------
const lib = {
  key: (x) => (x?.id ? 'id:' + x.id : 'n:' + String(x?.name ?? x?.title ?? '').toLowerCase().trim()),
  get(x) { return store.get('lib:' + lib.key(x), null) ?? (x?.id ? store.get('lib:' + lib.key({ name: x.name }), null) : null); },
  put(m) {
    const p = m.payload ?? {}, id = p.id ?? m.id, name = m.title ?? p.title ?? p.name;
    if (!id && !name) return;
    const v = { kind: m.kind, title: name, payload: p, at: Date.now() };
    if (id) store.set('lib:' + lib.key({ id }), v);
    if (name) store.set('lib:' + lib.key({ name }), v);
  },
  // what the server library holds (ids and names), filled from study_library index
  remote: new Set(),
  has(x) { return !!lib.get(x) || (x?.id && lib.remote.has('id:' + x.id)) || lib.remote.has('n:' + String(x?.name ?? '').toLowerCase().trim()); },
  async fetch(x) {
    if (!S.library) return null;
    try { const r = await callTool('study_library', { library: S.library, op: 'get', id: x?.id || undefined, name: x?.name || undefined }); if (r?.item) { lib.put({ kind: r.item.kind, title: r.item.title, payload: r.item.payload }); return r.item; } } catch {}
    return null;
  },
};
const libKey = () => { let k = store.get('library', ''); if (!/^[A-Za-z0-9_-]{24,64}$/.test(k)) { k = Array.from(crypto.getRandomValues(new Uint8Array(18)), (b) => b.toString(36).padStart(2, '0')).join('').slice(0, 32); store.set('library', k); } return k; };

// ---------- state ----------
// Places: subjects (home), subject (hub), part (one exam part), setup.
// Everything else is a modal over the current place: deck, test, result, mindmap, doc, make,
// sort, inbox, notes, editpart, files, newsubject.
const newSession = () => { const a = new Uint8Array(12); crypto.getRandomValues(a); return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join(''); };
const S = {
  session: newSession(), view: 'subjects', modal: null, menu: false, display: 'inline', modes: ['inline'],
  setup: { step: 0, storage: store.get('storage', ''), status: null },
  subjects: null, data: {}, subject: store.get('subject', ''), part: '', loading: '',
  selected: new Map(), makePart: '', makePreset: '', proposal: null, files: null, path: 'Studying',
  deck: null, idx: 0, flipped: false, srs: {}, order: [],
  test: null, answers: {}, touched: new Set(), q: 0, started: 0, submitted: false,
  results: null, mindmap: null, doc: null, mmView: 'map', mmShut: new Set(),
  ready: [], wantOpen: 0, bulk: 0, bulkN: 0, library: '', progress: null, progressTs: 0, stepTimes: [], pollUntil: 0, lastSeq: 0, report: null,
};
const STATUS = ['not started', 'studying', 'ready', 'done'];
const cur = () => S.data[S.subject] ?? null;
const partOf = (name) => cur()?.parts.find((p) => p.name === name);
const dot = (st) => `<span class="dot ${esc(String(st ?? '').replace(/\s/g, '-'))}" aria-hidden="true"></span>`;

// ---------- connection with Claude ----------
const app = new App({ name: 'Studying', version: '0.2.0' }, { availableDisplayModes: ['inline', 'fullscreen'] });
function ask(text) {
  const msg = `Studying: ${text} (session: ${S.session})`;
  // a job that makes material delivers in the background; anything else the user asked to see opens
  S.wantOpen = /^(make study material|load all)/.test(text) ? 0 : Date.now();
  keepPolling(10 * 60_000);
  const fail = () => { S.pollUntil = 0; toast('Could not send to Claude. Type your request in the chat instead.'); };
  app.sendMessage({ role: 'user', content: [{ type: 'text', text: msg }] }).then((r) => { if (r?.isError) fail(); }, fail);
}
function link(url) { if (!url) return; const fail = () => toast('Open ' + url); app.openLink({ url }).then((r) => { if (r?.isError) fail(); }, fail); }
async function callTool(name, args) {
  const r = await app.callServerTool({ name, arguments: args });
  return r?.structuredContent ?? (() => { try { return JSON.parse(r?.content?.[0]?.text ?? '{}'); } catch { return {}; } })();
}

// mailbox: poll only while Claude is working on something this window asked for.
// pollUntil moves forward on a request (10 min), on live progress (3 min) and on each result
// (90 s, since one job can push several results), and is pulled in when a job ends.
let pollTimer = null, pulling = false;
function keepPolling(ms) { S.pollUntil = Math.max(S.pollUntil, Date.now() + ms); startPolling(); }
function startPolling() { if (!pollTimer) { pollTimer = setInterval(pull, 2500); pull(); } }
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
async function pull() {
  if (document.hidden || pulling) return;
  pulling = true;
  try {
    for (let round = 0; round < 5; round++) {
      let d;
      try { d = await callTool('study_pull', { session: S.session, after: S.lastSeq, library: S.library || undefined }); } catch { return; }
      if (typeof d?.seq === 'number' && d.seq < S.lastSeq) { S.lastSeq = 0; continue; } // mailbox was reset
      if (d?.progress) onProgress(d.progress);
      for (const m of d?.messages ?? []) {
        if (!(m.seq > S.lastSeq)) continue;
        S.lastSeq = m.seq;
        keepPolling(90_000);
        try { receive(m); } catch (e) { toast(`Could not show "${m.title ?? m.kind}". Ask Claude to send it again.`); console.error(e); }
      }
      if (!d?.more) break;
    }
  } finally {
    pulling = false;
    if (Date.now() > S.pollUntil) stopPolling();
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && pollTimer) pull(); });

function setSubjects(list) {
  S.subjects = arr(list).filter((x) => x && x.name).map((x) => ({ ...x, name: String(x.name), parts: arr(x.parts).map((p) => (typeof p === 'string' ? p : p?.name)).filter(Boolean) }));
}
function normIndex(p) {
  const part = (x) => ({ ...x, name: String(x?.name ?? ''), materials: arr(x?.materials), generated: arr(x?.generated), results: arr(x?.results),
    topics: arr(x?.topics).filter((t) => t && t.name).map((t) => ({ ...t, name: String(t.name) })), status: x?.status ?? 'not started',
    score: x?.score ?? null, best: x?.best ?? null, date: x?.date ?? null });
  return { ...p, name: String(p.name), parts: arr(p.parts).map((x) => (typeof x === 'string' ? part({ name: x }) : part(x))).filter((x) => x.name),
    shared: { materials: arr(p.shared?.materials), generated: arr(p.shared?.generated) }, inbox: arr(p.inbox),
    memory: { summary: p.memory?.summary ?? '', weakTopics: arr(p.memory?.weakTopics), strengths: arr(p.memory?.strengths) } };
}

function receive(m) {
  const p = m.payload;
  switch (m.kind) {
    case 'setup_status': S.setup.status = p; if (p?.ok) { S.setup.step = 3; if (p.storage) store.set('storage', p.storage); if (p.subjects) setSubjects(p.subjects); } S.modal = null; go('setup'); break;
    case 'subjects': setSubjects(Array.isArray(p) ? p : p?.subjects);
      if (S.view === 'setup' && S.setup.step === 4 && S.subjects.length) S.view = 'subjects';
      render(); break;
    case 'subject': {
      if (!p?.name) break;
      const ix = normIndex(p);
      S.data[ix.name] = ix;
      if (p.subjects) setSubjects(p.subjects);
      if (!S.subjects) S.subjects = [];
      if (!S.subjects.some((x) => x.name === ix.name)) S.subjects.push({ name: ix.name, parts: ix.parts.map((x) => x.name), examDate: ix.examDate });
      if (S.loading === ix.name || !S.subject || S.view === 'subjects' || S.view === 'setup') {
        S.subject = ix.name; store.set('subject', ix.name); S.loading = '';
        if (S.view !== 'part') S.view = 'subject';
      }
      if (S.modal?.type === 'sort') S.modal = null;
      render(); break;
    }
    case 'proposal': S.proposal = { ...p, items: arr(p?.items).map((x) => ({ ...x, include: x.to !== 'skip' })) }; if (p?.subject) S.subject = p.subject; openModal('sort'); break;
    case 'files': S.files = { ...p, items: arr(p?.items) }; S.path = p?.path ?? S.path; openModal('files'); break;
    case 'deck': case 'test': case 'mindmap': case 'document': case 'plan': case 'results':
      lib.put(m);
      if (S.bulk && Date.now() - S.bulk < 15 * 60_000) { S.bulkN++; toast(`Loaded ${S.bulkN}: ${m.title ?? p?.title ?? m.kind}`); render(); break; }
      if (S.wantOpen && Date.now() - S.wantOpen < 10 * 60_000) { S.wantOpen = 0; show(m); }
      else { S.ready = [m, ...S.ready.filter((x) => (x.title ?? x.payload?.title) !== (m.title ?? p?.title))].slice(0, 30); toast(`Ready: ${m.title ?? p?.title ?? m.kind}`); drawTop(); if (S.modal?.type === 'ready') render(); }
      break;
    case 'notice': toast(p?.text ?? String(p ?? '')); break;
    case 'settings': LOOK = { ...(p?.ui ?? p ?? {}) }; store.set('ui', LOOK); applyUi(); render(); break;
  }
}

// opens made material from the server library; asks Claude only when the library does not have it
async function openFile(d) {
  toast('Opening');
  const it = await lib.fetch({ id: d.id, name: d.n });
  if (it) return show({ kind: it.kind, title: it.title, payload: it.payload });
  ask(`open "${d.n}"${d.id ? ` (id ${d.id})` : ''}${where()} and push it with "id" set to its file id: decks, tests and mind maps as their kind, results as results, anything else as a document with a readable version of its content.`);
}
// shows the last known subjects at once, from the server library
async function loadLibrary() {
  if (!S.library) return;
  let r; try { r = await callTool('study_library', { library: S.library, op: 'index' }); } catch { return; }
  for (const x of r?.items ?? []) lib.remote.add(x.key);
  for (const ix of r?.data ?? []) if (ix?.name) S.data[ix.name] = normIndex(ix);
  if (r?.subjects?.length) setSubjects(r.subjects);

    const st = store.get('stats', {}); const dur = Date.now() - (S.stepTimes[0]?.t ?? Date.now());

// simple spaced repetition (SM-2 style): days until the card comes back
function sched(s, r) {
  const prev = s ?? { interval: 0, ease: 2.5, reps: 0 };
  let { interval, ease, reps } = prev;
  if (r === 'again') { interval = 0; ease = Math.max(1.3, ease - 0.2); reps = 0; }
  else if (r === 'hard') { interval = Math.max(1, Math.round((interval || 1) * 1.2)); ease = Math.max(1.3, ease - 0.15); reps++; }
  else if (r === 'good') { interval = reps === 0 ? 1 : reps === 1 ? 3 : Math.round(interval * ease); reps++; }

document.addEventListener('change', (e) => {
  if (e.target.closest('#settings-form') && e.target.id !== 's-rule') {
    const f = (x) => $(x)?.value;

  }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset;
  if (d.act === 'pick-storage') { S.setup.storage = d.s; store.set('storage', d.s); return render(); }
  if (d.act === 'prop-inc') { S.proposal.items[d.i].include = el.checked; return render(); }
  if (d.act === 'prop-to') { const x = S.proposal.items[d.i]; x.to = el.value; x.include = el.value !== 'skip'; return render(); }
  if (!S.test || S.modal?.type !== 'test') return;
  const q = S.test.questions[S.q];
  if (d.act === 'ans-single') S.answers[q.id] = q.type === 'truefalse' ? Number(d.i) === 0 : Number(d.i);
  else if (d.act === 'ans-multi') { const s = new Set(S.answers[q.id] ?? []); el.checked ? s.add(Number(d.i)) : s.delete(Number(d.i)); S.answers[q.id] = [...s]; }
  else if (d.act === 'ans-match') { S.answers[q.id] = { ...(S.answers[q.id] ?? {}) }; S.answers[q.id][d.i] = el.value === '' ? '' : Number(el.value); }
  else return;
  render();
});
document.addEventListener('input', (e) => {

  if (!S.test) return;
  const q = S.test.questions[S.q];
  if (el.dataset.act === 'ans-text') S.answers[q.id] = el.value;

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.menu) { S.menu = false; return render(); } if (S.modal) return closeModal(); }
  if (S.modal?.type !== 'deck' || !S.deck || e.target.closest('input, textarea, select')) return;

function exportCsv() {
  const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const csv = 'front,back,source,topic\n' + S.deck.cards.map((c) => [c.front, c.back, c.source, c.topic].map(q).join(',')).join('\n');
  const name = (S.deck.title || 'deck').replace(/[^\w-]+/g, '-') + '.csv';
  app.downloadFile({ contents: [{ type: 'resource', resource: { uri: `file:///${name}`, mimeType: 'text/csv', text: csv } }] })
    .then((r) => { if (r?.isError) throw 0; }).catch(() => toast('Downloads are not allowed here. Ask Claude to save the CSV to your storage'));
}

function hostContext(ctx) {

  if (ctx.availableDisplayModes) S.modes = ctx.availableDisplayModes;
  const sa = ctx.safeAreaInsets;
  if (sa) { document.documentElement.style.setProperty('--top', `${Math.max(0, Number(sa.top) || 0)}px`); document.documentElement.style.setProperty('--bottom', `${Math.max(0, Number(sa.bottom) || 0)}px`); }
  const h = ctx.containerDimensions?.maxHeight ?? ctx.containerDimensions?.height;
  if (S.display === 'fullscreen' && h) document.documentElement.style.setProperty('--h', `${h}px`);
  else document.documentElement.style.removeProperty('--h');
}

app.onhostcontextchanged = (ctx) => { hostContext({ ...app.getHostContext(), ...ctx }); render(); };
app.ontoolinput = ({ arguments: a }) => {
  if (a?.session && /^[A-Za-z0-9_-]{12,64}$/.test(a.session)) S.session = a.session;
  if (a?.library && /^[A-Za-z0-9_-]{24,64}$/.test(a.library) && a.library !== S.library) { S.library = a.library; store.set('library', a.library); loadLibrary(); }
  if (a?.view) S.view = { setup: 'setup', home: 'subjects' }[a.view] ?? (S.subject ? 'subject' : 'subjects');
  for (const m of [].concat(a?.data ?? [])) if (m?.kind) receive({ kind: m.kind, title: m.title, payload: m.payload });
  render();
};
// test hook: lets a page without a host feed messages in (used by tests and local previews)
window.__studying = { receive: (m) => receive(m), go, S, openModal, render };
if (S.subject) S.view = 'subject';
applyUi();
render();
await app.connect();
connected = true;
hostContext(app.getHostContext());
render();
if (S.modes.includes('fullscreen') && S.display !== 'fullscreen') toggleFull();
S.library = S.library || libKey();
loadLibrary();
startPolling();
</script>
